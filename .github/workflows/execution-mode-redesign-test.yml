name: Execution Mode Redesign Verification

on:
  push:
    branches:
      - feat/execution-mode-redesign

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run execution-mode redesign regression set
        working-directory: tests
        run: >-
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          --config jest.config.json
          --runInBand
          orchestrator/execution-mode-registry.test.js
          orchestrator/execution-mode-product-sync.test.js
          orchestrator/execution-mode-ui.test.js
          orchestrator/execution-mode-quick-flow.test.js
          orchestrator/execution-mode-quick-flow-integration.test.js
          orchestrator/preset-library.test.js
          orchestrator/preset-library-migration.test.js
          orchestrator/preset-library-seed.test.js
          orchestrator/preset-lifecycle-hooks.test.js
          orchestrator/editor-persist-presets.test.js
          orchestrator/editor-state-presets.test.js
          orchestrator/get-effective-profile-presets.test.js
          orchestrator/ensure-settings-migration.test.js
          orchestrator/character-overrides-presets.test.js
          orchestrator/character-override-enabled.test.js
          orchestrator/clear-character-extension-for-mode.test.js
          orchestrator/agent-prompt-preset-routing-data.test.js
          orchestrator/custom-tool-portable-roundtrip.test.js
          orchestrator/card-import-custom-tools.test.js
          orchestrator/skill-resolution-runtime-plumbing.test.js
          orchestrator/skill-resolution-scope-precedence.test.js
          orchestrator/spec-agenda-loop-three-modes.test.js
          orchestrator/director-preset-swap.test.js
          orchestrator/custom-tool-runtime-spec.test.js
          orchestrator/custom-tool-runtime-agenda.test.js
          orchestrator/custom-tool-runtime-loop.test.js
          orchestrator/custom-tool-runtime-director.test.js
          orchestrator/abort-mid-run.test.js
